basePath: /v1
definitions:
  agent.Request:
    properties:
      query:
        type: string
    type: object
  handlers.CreateFeedFollowRequest:
    properties:
      feed_id:
        type: string
    type: object
  handlers.CreateFeedRequest:
    properties:
      name:
        type: string
      url:
        type: string
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      token:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.embeddingResponse:
    properties:
      dimension:
        type: integer
      id:
        type: string
      model:
        type: string
      post_id:
        type: string
      provider:
        type: string
    type: object
  handlers.postSummaryResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      model:
        type: string
      post_id:
        type: string
      summary:
        type: string
      updated_at:
        type: string
    type: object
  handlers.recommendationItem:
    properties:
      category:
        type: string
      description:
        type: string
      feed_id:
        type: string
      feed_name:
        type: string
      id:
        type: string
      published_at:
        type: string
      recent_scrape:
        type: string
      score:
        type: number
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      trending:
        type: integer
      url:
        type: string
    type: object
  handlers.recommendationsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.recommendationItem'
        type: array
      limit:
        type: integer
      message:
        type: string
      offset:
        type: integer
      source:
        type: string
      total:
        type: integer
    type: object
  handlers.searchResponse:
    properties:
      limit:
        type: integer
      mode:
        type: string
      offset:
        type: integer
      query:
        type: string
      results:
        items:
          $ref: '#/definitions/handlers.searchResult'
        type: array
      sort:
        type: string
      total:
        type: integer
    type: object
  handlers.searchResult:
    properties:
      created_at:
        type: string
      description:
        type: string
      feed_id:
        type: string
      id:
        type: string
      published_at:
        type: string
      rank:
        type: number
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  models.Feed:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      url:
        type: string
      user_id:
        type: string
    type: object
  models.FeedFollow:
    properties:
      created_at:
        type: string
      feed_id:
        type: string
      id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.Post:
    properties:
      created_at:
        type: string
      description:
        type: string
      feed_id:
        type: string
      id:
        type: string
      published_at:
        type: string
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  models.User:
    properties:
      api_key:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  rag.AskRequest:
    properties:
      limit:
        type: integer
      query:
        type: string
    type: object
  rag.AskResponse:
    properties:
      answer:
        type: string
      generated_at:
        type: string
      model:
        type: string
      query:
        type: string
      sources:
        items:
          $ref: '#/definitions/rag.Source'
        type: array
    type: object
  rag.Source:
    properties:
      description:
        type: string
      feed_id:
        type: string
      id:
        type: string
      published_at:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: AI-powered RSS aggregation API with JWT and API key authentication.
  title: RSS Server API
  version: "1.0"
paths:
  /agent/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chat with AI agent
      tags:
      - Agent
  /ask:
    get:
      consumes:
      - application/json
      parameters:
      - description: Question query
        in: query
        name: q
        type: string
      - description: JSON request body
        in: body
        name: request
        schema:
          $ref: '#/definitions/rag.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rag.AskResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ask a question
      tags:
      - RAG
    post:
      consumes:
      - application/json
      parameters:
      - description: Question query
        in: query
        name: q
        type: string
      - description: JSON request body
        in: body
        name: request
        schema:
          $ref: '#/definitions/rag.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rag.AskResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ask a question
      tags:
      - RAG
  /feedfollows:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FeedFollow'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List followed feeds
      tags:
      - Feed Follows
    post:
      consumes:
      - application/json
      parameters:
      - description: Follow payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateFeedFollowRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.FeedFollow'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Follow feed
      tags:
      - Feed Follows
  /feedfollows/{feedfollowID}:
    delete:
      parameters:
      - description: Feed follow ID
        in: path
        name: feedfollowID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unfollow feed
      tags:
      - Feed Follows
  /feeds:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Feed'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List feeds
      tags:
      - Feeds
    post:
      consumes:
      - application/json
      parameters:
      - description: Feed payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateFeedRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Feed'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create feed
      tags:
      - Feeds
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - Health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness check
      tags:
      - Health
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /posts:
    get:
      parameters:
      - description: Search text
        in: query
        name: search
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Post'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List posts
      tags:
      - Posts
  /posts/{postID}/embeddings:
    post:
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.embeddingResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Generate post embedding
      tags:
      - Posts
  /posts/{postID}/summary:
    get:
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.postSummaryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get post summary
      tags:
      - Posts
  /recommendations:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Optional feed UUID
        in: query
        name: feed_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.recommendationsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get recommendations
      tags:
      - Recommendations
  /refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token
      tags:
      - Auth
  /search:
    get:
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Sort mode (relevance, newest, oldest)
        in: query
        name: sort
        type: string
      - description: Search mode (text, semantic, hybrid)
        in: query
        name: mode
        type: string
      - description: Optional feed UUID
        in: query
        name: feed_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.searchResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
